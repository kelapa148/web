- title: "IDSECCONF 2025 - Indonesia IT Security Conference"
  year: 2025
  date: "November 8-9, 2025"
  venue: "Ballroom Menara Pinisi, Gedung Phinisi, Universitas Negeri Makassar (UNM), Makassar"
  description: "COCONUT hosted IDSECCONF 2025, the annual Indonesia IT Security Conference, held in Makassar under the theme \"Cybersecurity for the Next Evolution: Society 6.0\". The event featured two days of seminars, panel discussions, pre-conference workshops (November 6-7) and a Capture The Flag (CTF) competition, opened with a keynote by Ir. Budi Rahardjo, M.Sc., Ph.D."
- title: "COCONUT Open Class Batch 8 - Go REST, Go Fast: Membangun REST API dengan Golang"
  year: 2025
  date: "October 20, 2025"
  venue: "IndigoHub Makassar, Sulawesi Selatan"
  description: "In collaboration with Indigo Telkom Indonesia, COCONUT Computer Club held Open Class Batch 8, a hands-on backend REST API training using the Go programming language that also introduced Apilogy, Telkom Indonesia's API marketplace. The class was led by Musdalipa and Syahrul Ramadhan with Ahmad Fajrul as moderator, and attended by more than 20 students and young developers from Makassar."
- title: "COCONUT Alumni Meetup - What! You Need to Know Before Becoming an Engineer"
  year: 2019
  date: "December 21, 2019"
  venue: "STMIK Profesional, Makassar"
  description: >-
    A talk series for college students and fresh graduates featuring eight
    COCONUT Computer Club alumni: Nurkholish Halim, Profesional Cybersecurity,
    on "Understanding The Digital Work Environment"; Bayu Mahendra, Database
    Engineer at OVO, on "Multi-model highly available database"; Recky Phiter,
    Sr. Software Engineer at DANA, on "Becoming a FinTech developer"; Iqbal
    Nasikin, Security Testing Compliance at Gojek, on "Professional Pentester
    vs Bug Hunter"; Muh Akbar, System Engineer at GVM Networks, on "Deploying
    Microservices & CI/CD Best Practices"; Muh Iqbal H, Security Engineer at
    LinkAja, on "How to start a career in cybersecurity"; Darmawan S, UI/UX
    Designer at Blue Bird Group, on "How Important is UI/UX Design in the
    Digital Products"; and Yaomal, System Engineer at Docotel, on "Scalable
    Cloud Infra with OpenStack+CEPH".
- title: "Full Dissclosure 2014 - Seminar Keamanan Teknologi Informasi Opensource"
  year: 2014
  date: "2014"
  venue: "Kampus 1 STMIK Profesional, Makassar"
  description: "A 20-hour open-source information security seminar organized by COCONUT Computer Club, featuring \"Teknologi Sistem Operasi Open Source dari Masa ke Masa\" by Tasrif Hasanuddin, ST, M.Cs; \"Keamanan Teknologi Informasi Dampak dan Ancaman Bagi NKRI\" by Kolonel Arh Syarif Hidayatullah; \"Pentester Diary: Journey to Become UID (Linux Hacking)\" by Ahmad Muammar W.K, OSCP, OSCE; and \"Fun with ELF: Reverse-Engineering On *nix Machine\" by Nurkholish Halim."
- title: "IDSECCONF 2012 - Konferensi Keamanan Komputer Nasional V"
  year: 2012
  date: "June 9-10, 2012"
  venue: "Gedung PWI Makassar"
  description: "IDSECCONF came to Makassar for the first time with the theme \"Teknik Keamanan dan Penerapannya pada Teknologi Mobile\", where COCONUT Computer Club members took part in organizing the event together with the local Makassar hacker community. The conference was attended by more than 400 participants and featured talks by Onno W. Purbo and a Capture The Flag (CTF) competition."

