- title: "A Standardized Exchange Schema for Clandestine Networks: Modeling Proto-Deep State Transitions and Network Resilience"
  authors: Halim, Nurkholish
  journal: Pre-print
  url: https://doi.org/10.5281/zenodo.20832822
  year: 2026
  pdf: /assets/publications/halim-dsix2026.pdf
  abstract: |-
    This paper proposes the Deep State Intelligence eXchange (DSIX), a prototype ontology and serialization model that adapts the architectural philosophy of STIX to clandestine network analysis while addressing the ontological mismatch between technical observables and socially constructed actors. DSIX separates Faction Nodes from Operator Nodes, allowing state capture to be modeled as the measurable co-optation, infiltration, or control of formal institutional instruments by informal power formations. The framework integrates provenance, source-validity scoring, confidence propagation, temporal relationships, and role-based network representation. We further specify a discrete-time Markov model over three states (Nascent Clan, Proto-Deep State, Deep State) using observable covariates such as Operator Capture Rate, Resource Autonomy, Cognitive Dominance, and Structural Redundancy. A Monte Carlo node-removal procedure is introduced to test network resilience under disruption. The paper includes an illustrative JSON Schema sketch, a worked historical encoding of 1MDB, synthetic demonstrations, sensitivity analysis, and a validation roadmap covering Gupta-Zuma state capture, 1MDB, Petrobras/Odebrecht, Iran-Contra, and Indonesia's Orde Baru. DSIX is presented as a proof-of-concept; empirical coefficient estimation and cross-case validation remain future work.
- title: "Strategic Warning in the Cognitive Domain: An Intelligence Framework for Counter-Deception"
  authors: Halim, Nurkholish
  journal: Pre-print
  url: https://doi.org/10.5281/zenodo.20832996
  year: 2026
  pdf: /assets/publications/halim-cogwar2026.pdf
  abstract: |-
    The literature on countering cognitive warfare is overwhelmingly tactical. This article argues that cognitive warfare achieves strategic effect less at the injection than through the slow re-parameterisation of a society's zeitgeist, the epistemic substrate that governs credibility. Reconstituting the problem within Intelligence Studies, as one of strategic warning and counter-deception rather than content moderation, it specifies a target ontology of the epistemic production chain and an institutional-epistemic susceptibility index built from V-Dem. A discrete-time event-history backtest across the world's democracies from 1970 to 2019 shows that the index anticipates subsequent democratic-epistemic regression out of sample. The exercise validates a measurable susceptibility proxy, not the attribution of warfare itself.
- title: "FairWave : A Fairness-Aware Asynchronous DAG-BFT Consensus"
  authors: Syariful Mujaddiq
  journal: Distributed, Parallel, and Cluster Computing (cs.DC)
  url: https://doi.org/10.48550/arXiv.2606.10982
  year: 2026
  abstract: |-
    Proof-of-Stake DAG-BFT consensus faces a trilemma between sybil resistance, reward fairness, and plutocracy. Existing protocols prioritize liveness over fair stake-based selection, driving longitudinal centralization. FairWave is a dual-channel DAG-BFT protocol that separates anchor selection from reward distribution. The selection channel is super-linear in stake, guaranteeing Sybil gain < 1 for K > 1; the reward channel is sub-linear via square-root stake normalization. DAG-derived uptime and latency metrics eliminate external oracles, and lagged reputation breaks circular dependency between selection outcomes and weights. Evaluated through approximately 550,000 Monte Carlo rounds against eight baselines, FairWave shows Gini 0.140 (vs. Pure-PoS 0.490), monotone HHI reduction from 0.039 to 0.020 over 50,000 epochs, and optimal Sybil split K* = 1. Safety follows unconditionally from the 2f + 1 commit rule; the liveness model predicts monotone degradation from 94.0% at b = 0.20 to 74.0% at b = 1/3, consistent with the architectural expectation of no discontinuous cliff.
- title: "HI-XDR: Hybrid Intelligent Framework for Adversarial-Resilient Anomaly Detection and Adaptive Cyber Response"
  authors: Wahid, A.R.
  journal: Journal of Cyber Security, 7(1), 589–614. 
  url: https://doi.org/10.32604/jcs.2025.071622
  year: 2025
  abstract: |-
    The rapid increase in cyber attacks requires accurate, adaptive, and interpretable detection and response mechanisms. Conventional security solutions remain fragmented, leaving gaps that attackers can exploit. This study introduces the HI-XDR (Hybrid Intelligent Extended Detection and Response) framework, which combines network-based Suricata rules and endpoint-based Wazuh rules into a unified dataset containing 45,705 entries encoded into 1058 features. A semantic-aware autoencoder-based anomaly detection module is trained and strengthened through adversarial learning using Projected Gradient Descent, achieving a minimum mean squared error of 0.0015 and detecting 458 anomaly rules at the 99th percentile threshold. A comparative evaluation against Isolation Forest, One-Class Support Vector Machine, and standard autoencoders showed superior performance with an area under the receiver operating characteristic curve (AUC) of 0.91 and an Area Under the Precision-Recall Curve (AUPRC) of 0.88, highlighting the benefits of combining rules and semantic embeddings. Resilience analysis shows that the adversarially trained model maintains stable reconstruction errors when attacked (0.001419 for normal samples vs. 0.001472 for corrupted samples). To improve interpretability, SHapley Additive exPlanations identifies critical rule attributes such as source encoding and compliance groups. Finally, the Deep Q-Network agent was trained over 5000 episodes, converging to an average reward of 20, and reliably selected decisive mitigation actions for anomalies while avoiding disruptive responses to harmless events. Overall, HI-XDR offers an intelligent, transparent, and robust approach to next-generation cybersecurity defense.
- title: "Stochastic recognition of Human daily activities via Hybrid Descriptors and Random Forest using Wearable sensors"
  authors: N Halim.
  journal: ScienceDirect (Array)
  url: https://doi.org/10.1016/j.array.2022.100190
  year: 2022
  pdf: /assets/publications/halim-array2022.pdf
  abstract: |-
    Human daily activity recognition (HDAR) using wearable sensors is an important task for researchers aiming to develop an effective and feasible model which is capable of accurately detecting human motion patterns. These applications provide elderly care, surveillance systems, and wellness tracking. Despite the pervasive use, recognition and monitoring of human physical activities remains inaccurate, which may contribute to negative reactions and feedback. This paper addresses a data-driven approach to recognizing human daily activities in an indoor-outdoor environment. To improve the classification and recognition of human life-log activities (for example, walking, drinking, and exercising), a model is introduced that incorporates pre-processing (such as denoising), hybrid features extraction from four domains, including time, frequency, wavelet, and time-frequency respectively. After that, stochastic gradient descent is exploited to optimize the selected features. The optimal extracted features are advanced to random forest classifiers in order to develop adaptive for human life-log activities. Additionally, the proposed HDAR model is experimentally evaluated on three benchmark datasets, namely, USC-HAD, which is comprised of 12 physical activities, IM-WSHA, which involves 11 life-log activities, and MOTIONSENSE which contains six static and dynamic activities, respectively. The experimental results show that the proposed HDAR method significantly achieves better results and outperforms others in terms of recognition rates of 91.08%, 91.45%, and 93.16% respectively.
- title: "Intelligent Human Anomaly Identification and Classification in Crowded Scenes via Multi-fused Features and Restricted Boltzmann Machines"
  authors: N Halim.
  journal: TechRxiv
  url: https://doi.org/10.36227/techrxiv.21215069.v1
  year: 2022
  abstract: |-
    With the advancement of technology and the breakthroughs of the modern era, accessing and transforming that data into information is becoming a more complex task for the scientific community. Specifically, a wide range of wearable and vision sensors are employed to capture multimodal data from diverse sources and fields. These have been incorporated into numerous domains and applications to assess academic and remote systems, emergency personnel, and monitoring systems. This paper presents a robust human anomaly detection and classification method in crowded scenes. First, crowdsourced data is acquired as an input. A few normalizing and filtering steps for denoising are performed. Then, human silhouettes are abstracted, which significantly facilitates human detection. Then, crowd-based analysis and clustering are employed for precise and efficient predictions. Following that feature engineering process, three robust features are extracted, including deep flow, gradient patches, and dense optical flow-based descriptors. Furthermore, stochastic gradient descent (SGD) was utilized for feature selection and optimization. Finally, optimized features are further fed to the Restricted Boltzmann Machines (RBM) classifier to advance adaptive training for the classification and predictions of human behavior in crowded scenes. The experimental results revealed an 88.1% accuracy and a 12.36% error rate for the Avenue dataset. The ADOC dataset attained an average recognition rate of 91.17 percent, and an error rate of 8.82 percent. Finally, the USCD-Ped 2 dataset achieved an improved recognition rate of 90.19% with an error rate of 9.81%.
- title: "Development of Human Resources in Android-based Information System for People with Social Welfare Problems"
  authors: A Arman, A Alang, Y Malago
  journal: Indonesian Journal of Law and Economics Review
  url: https://ijler.umsida.ac.id/index.php/ijler/article/view/689/701
  year: 2020
  abstract: |-
    This study discusses the development of human resources in an Android-based information system for people with social welfare problems (PMKS). In the current industrial era, reliable technology and human resources are needed, and Android-based mobile technology opens great potential to change the way services are delivered, including the data collection and reporting processes for social welfare services, such as those in Gorontalo City.
- title: "Location-Based Mobile Augmented Reality Development For Searching Tourism Place In Ambon Island"
  authors: Yusuf Yacob Ona Ola.
  journal: UAJY
  url: https://repository.uajy.ac.id/id/eprint/9863/
  year: 2016
  abstract: |-
    Ambon Island is part of the Maluku archipelago in eastern Indonesia, known for its historical, cultural, and natural tourism. Until recently, tourism information for Ambon was only available through websites and blogs. This research combines location-based Augmented Reality technology using the Wikitude SDK with Google Maps services to present tourism location information in Ambon. The developed application runs on Android mobile devices with GPS and internet access, helping users easily find tourist attractions on the island. Thirty respondents participated in the study; blackbox testing was conducted to verify the main functions of the Mangente application, and a questionnaire-based test measured the application's usability.
